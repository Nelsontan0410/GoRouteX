<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dispatch | GoRouteX</title><link rel="icon" href="marketing-favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/typography.css"><link rel="stylesheet" href="app-experience.css"><link rel="stylesheet" href="dispatch/dispatch.css"><link rel="stylesheet" href="styles/app-sidebar.css"><link rel="stylesheet" href="styles/ui-refresh.css">
  <script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script defer src="firebase-config.js"></script>
  <script defer src="route-planner-product.js"></script>
  <script defer src="account-context.js"></script>
  <script defer src="route-storage.js"></script>
  <script defer src="dispatch/day-route.js"></script>
  <script defer src="dispatch/dispatch-board.js"></script>
  <script defer src="dispatch/dispatch-page.js"></script>
</head>
<body>
<a class="skip-link" href="#dispatchMain">Skip to Dispatch</a>
<div class="dispatch-shell">
  <aside class="operations-sidebar" data-app-sidebar data-active="dispatch" data-mobile-nav="top"></aside>
  <script src="app-sidebar.js"></script>
  <main id="dispatchMain" class="dispatch-main">
    <p id="dispatchPageState" class="dispatch-page-state" role="status" aria-live="polite">Loading finalized plan...</p>
    <section id="dispatchBoard" class="dispatch-board" aria-labelledby="dispatchTitle" hidden>
      <div class="dispatch-heading ui-page-header"><div><span class="ui-eyebrow">Dispatch</span><h1 id="dispatchTitle" class="ui-title">Dispatch</h1><p class="ui-subtitle">Assign the finalized plan to a driver, print the schedule and follow progress live.</p></div><button id="dispatchRefreshBtn" type="button" class="action-button-secondary">Refresh status</button></div>
      <section id="dispatchKpis" class="ui-kpi-grid dispatch-kpis" aria-label="Plan summary" hidden></section>
      <p id="dispatchPlanSummary" class="dispatch-plan-summary"></p>
      <div id="dispatchNotice" class="dispatch-notice" role="status" hidden></div>
      <div class="dispatch-toolbar"><div class="dispatch-toolbar-title"><strong>Assign &amp; send</strong><a class="ui-link-button" href="settings.html#drivers">Manage drivers</a></div><label class="dispatch-all-driver">Driver <select id="dispatchAllDriver"><option value="">Select driver</option></select></label><button id="dispatchPrintAllBtn" type="button" class="action-button-secondary" disabled>Print schedule list</button><a id="dispatchLiveBtn" class="action-button-secondary dispatch-live-btn" href="#" hidden>View live</a><button id="dispatchAllBtn" type="button" class="action-button-primary" disabled>Dispatch to driver</button></div>
      <div id="dispatchRouteTabs" class="dispatch-route-tabs" role="tablist" aria-label="Routes"></div>
      <div id="dispatchRoutes" class="dispatch-routes"></div>
    </section>
  </main>
</div>
</body>
</html>
